
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- Fragmento de pestañas de categorías -->
    <section th:fragment="tabs" class="py-3">
        <ul class="nav nav-underline justify-content-center">

            <li class="nav-item">
                <a th:href="@{/}"
                   class="nav-link"
                   th:classappend="${idCategoriaActual == null} ? 'active'">
                    Todas
                </a>
            </li>

            <li th:each="c : ${categorias}" class="nav-item">
                <a class="nav-link"
                   th:href="@{/consultas/{id}(id=${c.idCategoria})}"
                   th:classappend="${idCategoriaActual != null
                   and idCategoriaActual.equals(c.idCategoria)} ? 'active'"
                   th:text="${c.descripcion}">
                </a>
            </li>

        </ul>
    </section>

    <!-- Fragmento de tarjetas de productos -->
    <section th:fragment="tarjetas(mostrarCarrito)"
             class="container py-4">

        <p th:if="${productos == null or productos.empty}"
           class="text-center text-muted py-4">
            No hay productos para mostrar.
        </p>

        <div class="row row-cols-1 row-cols-md-3 g-4">

            <div th:each="p : ${productos}" class="col">

                <article class="card tarjeta-producto h-100">

                    <img th:if="${p.rutaImagen != null}"
                         th:src="${p.rutaImagen}"
                         th:alt="${p.descripcion}"
                         class="card-img-top"
                         style="height:200px; object-fit:contain"/>

                    <div class="card-body">

                        <h5 class="card-title"
                            th:text="${p.descripcion}">
                        </h5>

                        <p class="card-text"
                           th:text="${p.detalle}">
                        </p>

                        <strong>
                            [[${#numbers.formatCurrency(p.precio)}]]
                        </strong>

                        <p class="mt-2">
                            Existencias: [[${p.existencias}]]
                        </p>

                    </div>

                </article>

            </div>

        </div>
    </section>

    <!-- Formularios de las tres consultas -->
    <section th:fragment="consultas"
             class="container-fluid px-4 py-3">

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-3">

            <div class="col">
                <div th:replace="~{consultas/fragmentos :: formConsulta(
                     'primary',
                     #{consultas.derivadas},
                     '/consultas/consultaDerivada')}">
                </div>
            </div>

            <div class="col">
                <div th:replace="~{consultas/fragmentos :: formConsulta(
                     'warning',
                     #{consultas.jpql},
                     '/consultas/consultaJPQL')}">
                </div>
            </div>

            <div class="col">
                <div th:replace="~{consultas/fragmentos :: formConsulta(
                     'success',
                     #{consultas.sql},
                     '/consultas/consultaSQL')}">
                </div>
            </div>

            <div class="col">
                <div class="card h-100">
                    <div class="card-body d-flex align-items-center justify-content-center">
                        <p class="mb-0 text-center">
                            Acá va su Práctica #2
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Formulario reutilizable -->
    <div th:fragment="formConsulta(colorForm, textoForm, urlForm)">

        <form method="post"
              th:action="@{${urlForm}}"
              class="was-validated">

            <div class="card h-100">

                <div class="card-header text-center text-white"
                     th:classappend="${'bg-' + colorForm}">
                    <h5 class="mb-0" th:text="${textoForm}"></h5>
                </div>

                <div class="card-body">

                    <div class="mb-3">
                        <label class="form-label"
                               th:text="#{consultas.precio.inferior}">
                        </label>

                        <input type="number"
                               name="precioInf"
                               th:value="${precioInf}"
                               class="form-control"
                               min="0"
                               step="0.01"
                               required/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label"
                               th:text="#{consultas.precio.superior}">
                        </label>

                        <input type="number"
                               name="precioSup"
                               th:value="${precioSup}"
                               class="form-control"
                               min="0"
                               step="0.01"
                               required/>
                    </div>

                </div>

                <div class="card-footer text-center">
                    <button type="submit"
                            class="btn text-white"
                            th:classappend="${'btn-' + colorForm}">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span th:text="${textoForm}"></span>
                    </button>
                </div>

            </div>

        </form>
    </div>

</body>
</html>
