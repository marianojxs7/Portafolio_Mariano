

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras-springsecurity6">

    <!-- Fragmento general: head -->
    <head th:fragment="head">
        <title th:text="#{aplicacion.titulo}">TechShop</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>

        <link rel="stylesheet"
              th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/>

        <link rel="stylesheet"
              th:href="@{/webjars/font-awesome/7.2.0/css/all.min.css}"/>

        <script th:src="@{/webjars/jquery/4.0.0/jquery.min.js}"></script>
        <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
    </head>

    <body>

        <!-- Fragmento general: header -->
        <header th:fragment="header">

            <!-- Menú principal -->
            <nav class="navbar navbar-expand-lg navbar-light bg-white">
                <div class="container">

                    <a class="navbar-brand" th:href="@{/}">
                        TechShop
                    </a>

                    <button class="navbar-toggler" type="button"
                            data-bs-toggle="collapse"
                            data-bs-target="#navbarContenido"
                            aria-controls="navbarContenido"
                            aria-expanded="false"
                            aria-label="Mostrar navegación">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse"
                         id="navbarContenido">

                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:href="@{/}"
                                   th:text="#{nav.inicio}">
                                    Inicio
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:href="@{/categoria/listado}"
                                   th:text="#{plantilla.categorias}">
                                    Categorías
                                </a>
                            </li>

                            <li class="nav-item">
                                <a class="nav-link"
                                   th:href="@{/producto/listado}"
                                   th:text="#{plantilla.productos}">
                                    Productos
                                </a>
                            </li>

                            <li class="nav-item dropdown">
                                <a class="nav-link dropdown-toggle"
                                   href="#"
                                   id="extrasDropdown"
                                   role="button"
                                   data-bs-toggle="dropdown"
                                   aria-expanded="false"
                                   th:text="#{plantilla.extras}">
                                    Extras
                                </a>

                                <ul class="dropdown-menu"
                                    aria-labelledby="extrasDropdown">

                                    <li>
                                        <a class="dropdown-item"
                                           th:href="@{/multimedia}">
                                            Multimedia
                                        </a>
                                    </li>

                                    <li>
                                        <a class="dropdown-item"
                                           th:href="@{/iframes}">
                                            Iframes
                                        </a>
                                    </li>

                                </ul>
                            </li>

                        </ul>

                        <!-- Selector de idiomas -->
                        <div class="dropdown">
                            <button class="btn btn-outline-primary dropdown-toggle"
                                    type="button"
                                    id="idiomaDropdown"
                                    data-bs-toggle="dropdown"
                                    aria-expanded="false"
                                    th:text="#{plantilla.idioma}">
                                Lenguaje
                            </button>

                            <ul class="dropdown-menu dropdown-menu-end"
                                aria-labelledby="idiomaDropdown">

                                <li>
                                    <a class="dropdown-item"
                                       th:href="@{/(lang=es)}">
                                        Español
                                    </a>
                                </li>

                                <li>
                                    <a class="dropdown-item"
                                       th:href="@{/(lang=en)}">
                                        English
                                    </a>
                                </li>

                                <li>
                                    <a class="dropdown-item"
                                       th:href="@{/(lang=fr)}">
                                        Française
                                    </a>
                                </li>

                                <li>
                                    <a class="dropdown-item"
                                       th:href="@{/(lang=pt)}">
                                        Portuguesa
                                    </a>
                                </li>

                            </ul>
                        </div>

                    </div>
                </div>
            </nav>

            <!-- Franja verde -->
            <div class="container-fluid bg-success text-white py-2">
                <div class="container">
                    <h2 class="mb-0 py-1">
                        <i class="fa-solid fa-gear"></i>
                        <span th:text="#{plantilla.suTienda}">
                            Su tienda en línea
                        </span>
                    </h2>
                </div>
            </div>

        </header>

        <!-- Fragmento general: footer -->
        <footer th:fragment="footer"
                class="container-fluid text-white py-2 mt-4"
                style="background-color: #0dcaf0;">

            <div class="container text-end">
                <p class="mb-0 py-2">
                    <span th:text="#{plantilla.derechos}">
                        TechShop - Todos los derechos reservados 2025
                    </span>
                    ©
                </p>
            </div>

        </footer>

        <!-- Fragmento general: mostrarToast -->
        <section th:fragment="mostrarToast">

            <div aria-live="polite"
                 aria-atomic="true"
                 class="position-fixed top-50 start-50 translate-middle"
                 style="z-index: 1080;">

                <!-- Mensaje de error -->
                <div th:if="${error}"
                     class="toast show"
                     role="alert"
                     aria-live="assertive"
                     aria-atomic="true">

                    <div class="toast-header text-white bg-danger">
                        <i class="fa-solid fa-bomb me-2"></i>
                        <strong class="me-auto">[[#{error}]]</strong>
                    </div>

                    <div class="toast-body">
                        <p>[[${error}]]</p>

                        <button type="button"
                                class="btn btn-secondary btn-sm"
                                data-bs-dismiss="toast">
                            [[#{accion.cerrar}]]
                        </button>
                    </div>
                </div>

                <!-- Mensaje de operación exitosa -->
                <div th:if="${todoOk}"
                     class="toast show"
                     role="status"
                     aria-live="polite"
                     aria-atomic="true">

                    <div class="toast-header text-white bg-success">
                        <i class="fa-solid fa-circle-check me-2"></i>
                        <strong class="me-auto">[[#{atencion}]]</strong>
                    </div>

                    <div class="toast-body">
                        <p>[[${todoOk}]]</p>

                        <button type="button"
                                class="btn btn-secondary btn-sm"
                                data-bs-dismiss="toast">
                            [[#{accion.cerrar}]]
                        </button>
                    </div>
                </div>

            </div>
        </section>

    </body>
</html>
