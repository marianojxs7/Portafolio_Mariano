
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{General/fragmentos :: head}"></head>

    <body>

        <header th:replace="~{General/fragmentos :: header}"></header>

        <div class="row my-5">
            <div class="col-md-4 offset-md-4">

                <div class="card">

                    <div class="card-header bg-success text-white text-center">
                        <h2>[[#{login.login}]]</h2>
                    </div>

                    <div class="card-body">

                        <form method="POST" th:action="@{/login}">

                            <div class="row my-3">
                                <label for="username"
                                       class="col-md-1 my-auto">
                                    <i class="fas fa-user-lock"></i>
                                </label>

                                <div class="col-md-11 my-auto">
                                    <input class="form-control"
                                           id="username"
                                           type="text"
                                           name="username"
                                           th:placeholder="#{login.username}"
                                           required/>
                                </div>
                            </div>

                            <div class="row my-3">
                                <label for="password"
                                       class="col-md-1 my-auto">
                                    <i class="fas fa-key"></i>
                                </label>

                                <div class="col-md-11 my-auto">
                                    <input class="form-control"
                                           id="password"
                                           type="password"
                                           name="password"
                                           th:placeholder="#{login.password}"
                                           required/>
                                </div>
                            </div>

                            <div class="d-flex justify-content-center mt-4">
                                <button class="btn btn-success"
                                        type="submit">
                                    <i class="fas fa-sign-in-alt"></i>
                                    [[#{login.login}]]
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

                <div th:if="${param.error != null}"
                     class="alert alert-danger mt-3 text-center"
                     role="alert">
                    [[#{error.login}]]
                </div>

                <div th:if="${param.logout != null}"
                     class="alert alert-success mt-3 text-center"
                     role="alert">
                    Sesión cerrada correctamente.
                </div>

            </div>
        </div>

        <footer th:replace="~{General/fragmentos :: footer}"></footer>

    </body>
</html>
